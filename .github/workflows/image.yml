name: Image

on:
  pull_request:
  push:
    branches: [main]
    # A version tag builds the image with that version and publishes it.
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

# A newer pull request push cancels the older run of that pull
# request. Each push to main gets a group of its own (its run id),
# because a group keeps only one pending run and would drop a queued
# main commit: every commit of main gets its image published, and the
# SHA tags make their order irrelevant.
concurrency:
  group: image-${{ github.workflow }}-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # packages: write is used only by the publish steps below, which run
    # on a push to main or of a version tag; a pull request from a fork
    # gets a read-only token whatever this block says.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Build the image
        run: |
          version="ci-${GITHUB_SHA}"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="$GITHUB_REF_NAME"
          fi
          docker build -t nau-hub:smoke \
            --build-arg VERSION="$version" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            .

      # A pull request builds and smoke-tests the image only; a push to
      # main or of a version tag also publishes it (below). The smoke
      # test runs the
      # image against a containerized sqld on a private Docker network
      # with synthetic owner and recovery variables generated in the
      # job (never real secrets), and checks /api/health, the served
      # index page, the login of the seeded owner, and the refusal of
      # the recovery route from outside the loopback of the hub.
      - name: Smoke test against a containerized sqld
        shell: bash
        run: |
          set -euo pipefail
          network="nau-hub-smoke-${GITHUB_RUN_ID}"
          # Remove the containers and the network on any exit, the
          # failing ones included; a resource that was never created is
          # ignored, and the step keeps its own exit status.
          cleanup() {
            docker rm -f nau-hub-app nau-hub-sqld >/dev/null 2>&1 || true
            docker network rm "$network" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker network create "$network"
          session_key=$(openssl rand -hex 32)
          owner_name="Synthetic Owner"
          owner_email="owner@example.test"
          owner_pass=$(openssl rand -hex 16)
          root_token=$(openssl rand -hex 20)
          docker run -d --name nau-hub-sqld --network "$network" \
            ghcr.io/tursodatabase/libsql-server:v0.24.31
          port=$((20000 + RANDOM % 40000))
          docker run -d --name nau-hub-app --network "$network" \
            -e NAU_HUB_DB_URL="http://nau-hub-sqld:8080" \
            -e NAU_HUB_SESSION_KEY="$session_key" \
            -e NAU_HUB_OWNER_NAME="$owner_name" \
            -e NAU_HUB_OWNER_EMAIL="$owner_email" \
            -e NAU_HUB_OWNER_PASSWORD="$owner_pass" \
            -e NAU_HUB_ROOT_TOKEN="$root_token" \
            -p "127.0.0.1:${port}:7440" \
            nau-hub:smoke
          ok=""
          body=""
          for _ in $(seq 1 60); do
            if body=$(curl -fsS "http://127.0.0.1:${port}/api/health" 2>/dev/null) \
              && printf '%s' "$body" | grep -q '"ok":true'; then
              ok=1
              break
            fi
            sleep 1
          done
          if [ -z "$ok" ]; then
            docker logs nau-hub-app
            exit 1
          fi
          echo "health: $body"
          curl -fsS "http://127.0.0.1:${port}/" -o /tmp/index.html
          grep -qi '<!doctype html>' /tmp/index.html
          grep -qi 'id="root"' /tmp/index.html
          # The seeded owner logs in: the fresh database was seeded on
          # the start with the synthetic owner variables.
          login_code=$(curl -s -o /tmp/login.json -w '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            -d "{\"email\":\"${owner_email}\",\"password\":\"${owner_pass}\"}" \
            "http://127.0.0.1:${port}/api/session")
          if [ "$login_code" != "200" ] || ! grep -q '"role":"owner"' /tmp/login.json; then
            echo "owner login: code=$login_code body=$(cat /tmp/login.json)"
            docker logs nau-hub-app
            exit 1
          fi
          # The recovery route is not reachable from here: the
          # connection comes through the published port, not from the
          # loopback of the container, so even the right synthetic
          # token gets the 404 of an unknown route.
          root_code=$(curl -s -o /dev/null -w '%{http_code}' \
            -X POST -H 'content-type: application/json' \
            -d "{\"token\":\"${root_token}\",\"new\":\"${owner_pass}\"}" \
            "http://127.0.0.1:${port}/api/session/root-token")
          if [ "$root_code" != "404" ]; then
            echo "the recovery route answered $root_code, want 404 (not the loopback)"
            exit 1
          fi

      # On a push to main or of a version tag, publish exactly the image
      # the smoke test just ran: the same local image, tagged by the
      # commit SHA (never latest), as the public package
      # ghcr.io/<owner>/<repository> (lowercase, as the registry
      # requires). A version tag also publishes it under the version, and
      # its SHA tag then replaces the one main published for that commit,
      # which differs only in the version it reports. The login uses the
      # job's GITHUB_TOKEN through docker/login-action; no secret goes in
      # a command argument.
      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the smoke-tested image
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}"
          docker tag nau-hub:smoke "$image"
          docker push "$image"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            release="ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_REF_NAME}"
            docker tag nau-hub:smoke "$release"
            docker push "$release"
          fi
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image")
          echo "published: $digest"
          echo "Published \`$digest\`" >> "$GITHUB_STEP_SUMMARY"
