name: Go checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: go-checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Go (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      GOTOOLCHAIN: auto
      GOMAXPROCS: 2
      CGO_ENABLED: 1
      CHECK_REPO: ${{ github.repository }}
      CHECK_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Check out the exact commit
        shell: pwsh
        run: |
          git init .
          if ($LASTEXITCODE -ne 0) { throw "git init failed" }
          git config core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw "git config core.autocrlf failed" }
          git remote add origin "https://github.com/${env:CHECK_REPO}.git"
          if ($LASTEXITCODE -ne 0) { throw "git remote add failed" }
          git fetch --depth 1 origin "${env:CHECK_SHA}"
          if ($LASTEXITCODE -ne 0) { throw "git fetch failed" }
          git checkout --detach "${env:CHECK_SHA}"
          if ($LASTEXITCODE -ne 0) { throw "git checkout failed" }
      - name: Resolve the native Go toolchain
        shell: pwsh
        run: |
          if (Get-Command go -ErrorAction SilentlyContinue) { return }
          $arch = if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64') { 'arm64' } else { 'x64' }
          $toolcache = $env:RUNNER_TOOL_CACHE
          if (-not $toolcache) { $toolcache = $env:AGENT_TOOLSDIRECTORY }
          if (-not $toolcache) { throw "Go is not on PATH and the runner toolcache is unset" }
          $exe = if ($IsWindows) { 'go.exe' } else { 'go' }
          $bin = Get-ChildItem (Join-Path $toolcache 'go') -Directory |
            Where-Object { $_.Name -match '^1\.(2[5-9]|[3-9]\d)\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName "$arch/bin" } |
            Where-Object { Test-Path (Join-Path $_ $exe) } |
            Select-Object -First 1
          if (-not $bin) { throw "Go is not on PATH and a native Go 1.25 or newer toolcache entry was not found (GOTOOLCHAIN=auto then selects the go.mod toolchain)" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Formatting and vet
        shell: pwsh
        run: |
          $files = @(git ls-files '*.go')
          if ($LASTEXITCODE -ne 0) { throw "git ls-files failed" }
          $formatting = @(gofmt -l $files)
          if ($LASTEXITCODE -ne 0 -or $formatting.Count -ne 0) { throw "gofmt failed: $formatting" }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { throw "go vet failed" }
      - name: Build
        shell: pwsh
        run: |
          go build -o "$env:RUNNER_TEMP/nau" ./cmd/nau
          if ($LASTEXITCODE -ne 0) { throw "go build ./cmd/nau failed" }
      - name: Native tests
        shell: pwsh
        run: |
          go test -timeout=30m ./...
          if ($LASTEXITCODE -ne 0) { throw "go test failed" }
      - name: Race detector
        shell: pwsh
        run: |
          go test -race -timeout=30m ./...
          if ($LASTEXITCODE -ne 0) { throw "go test -race failed" }

  integration:
    name: Real database integration
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    services:
      database:
        image: ghcr.io/tursodatabase/libsql-server:v0.24.31
        ports:
          - 8080/tcp
    env:
      GOTOOLCHAIN: auto
      GOMAXPROCS: 2
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Wait for the database
        env:
          NAU_TEST_SQLD_URL: http://localhost:${{ job.services.database.ports[8080] }}
        run: |
          curl --fail --silent --show-error \
            --retry 30 --retry-connrefused --retry-delay 1 \
            --retry-max-time 60 --max-time 2 \
            "$NAU_TEST_SQLD_URL/health"
      - name: Run the tagged integration suites
        env:
          NAU_TEST_SQLD_URL: http://localhost:${{ job.services.database.ports[8080] }}
        run: go test -count=1 -timeout=30m -tags sqld ./internal/hub/...

  web-contract:
    name: Observed web read contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: auto
      GOMAXPROCS: 2
      CGO_ENABLED: 1
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Resolve the native Go toolchain
        shell: pwsh
        run: |
          if (Get-Command go -ErrorAction SilentlyContinue) { return }
          $arch = if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64') { 'arm64' } else { 'x64' }
          $toolcache = $env:RUNNER_TOOL_CACHE
          if (-not $toolcache) { $toolcache = $env:AGENT_TOOLSDIRECTORY }
          if (-not $toolcache) { throw "Go is not on PATH and the runner toolcache is unset" }
          $bin = Get-ChildItem (Join-Path $toolcache 'go') -Directory |
            Where-Object { $_.Name -match '^1\.(2[5-9]|[3-9]\d)\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName "$arch/bin" } |
            Where-Object { Test-Path (Join-Path $_ 'go') } |
            Select-Object -First 1
          if (-not $bin) { throw "A native Go 1.25 or newer toolcache entry was not found" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.0'
      - run: bun install --frozen-lockfile
        working-directory: web
      - name: Check actual responses against consumer types
        shell: bash
        run: |
          set -euo pipefail
          database=""
          cleanup() {
            if [ -n "$database" ]; then docker rm -f "$database" >/dev/null; fi
          }
          trap cleanup EXIT
          database=$(docker run -d -p 127.0.0.1::8080 ghcr.io/tursodatabase/libsql-server:v0.24.31)
          address=$(docker port "$database" 8080/tcp)
          export NAU_TEST_SQLD_URL="http://${address}"
          export NAU_TEST_SQLD_TOKEN=""
          ready=""
          for attempt in $(seq 1 30); do
            if curl --max-time 2 --fail --silent "${NAU_TEST_SQLD_URL}/health" >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          test "$ready" = 1
          go test -count=1 -timeout=2m -tags 'sqld webcontract' ./internal/hub/machines -run '^TestWebReadContract$'

  fuzz:
    name: Ingest HTTP framing fuzz
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GOTOOLCHAIN: auto
      GOMAXPROCS: 2
    steps:
      - name: Check out the exact commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Resolve the native Go toolchain
        shell: pwsh
        run: |
          if (Get-Command go -ErrorAction SilentlyContinue) { return }
          $arch = if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64') { 'arm64' } else { 'x64' }
          $toolcache = $env:RUNNER_TOOL_CACHE
          if (-not $toolcache) { $toolcache = $env:AGENT_TOOLSDIRECTORY }
          if (-not $toolcache) { throw "Go is not on PATH and the runner toolcache is unset" }
          $exe = if ($IsWindows) { 'go.exe' } else { 'go' }
          $bin = Get-ChildItem (Join-Path $toolcache 'go') -Directory |
            Where-Object { $_.Name -match '^1\.(2[5-9]|[3-9]\d)\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName "$arch/bin" } |
            Where-Object { Test-Path (Join-Path $_ $exe) } |
            Select-Object -First 1
          if (-not $bin) { throw "Go is not on PATH and a native Go 1.25 or newer toolcache entry was not found (GOTOOLCHAIN=auto then selects the go.mod toolchain)" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Fuzz authenticated ingest framing
        timeout-minutes: 5
        run: go test -count=1 -timeout=3m ./internal/hub/machines -run '^$' -fuzz '^FuzzIngestHTTPFraming$' -fuzztime=30s -parallel=2

  attribution:
    name: Attribution policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: auto
    steps:
      - name: Check out the candidate history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
        timeout-minutes: 3
      - name: Resolve the native Go toolchain
        shell: pwsh
        run: |
          if (Get-Command go -ErrorAction SilentlyContinue) { return }
          $arch = if ([Runtime.InteropServices.RuntimeInformation]::OSArchitecture -eq 'Arm64') { 'arm64' } else { 'x64' }
          $toolcache = $env:RUNNER_TOOL_CACHE
          if (-not $toolcache) { $toolcache = $env:AGENT_TOOLSDIRECTORY }
          if (-not $toolcache) { throw "Go is not on PATH and the runner toolcache is unset" }
          $exe = if ($IsWindows) { 'go.exe' } else { 'go' }
          $bin = Get-ChildItem (Join-Path $toolcache 'go') -Directory |
            Where-Object { $_.Name -match '^1\.(2[5-9]|[3-9]\d)\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName "$arch/bin" } |
            Where-Object { Test-Path (Join-Path $_ $exe) } |
            Select-Object -First 1
          if (-not $bin) { throw "Go is not on PATH and a native Go 1.25 or newer toolcache entry was not found (GOTOOLCHAIN=auto then selects the go.mod toolchain)" }
          Add-Content -Path $env:GITHUB_PATH -Value $bin
      - name: Build the attribution checker
        timeout-minutes: 2
        run: go build -o "$RUNNER_TEMP/attribution" ./internal/ci/attribution
      - name: Check attribution
        timeout-minutes: 3
        env:
          NAU_ATTRIBUTION_POLICY: ${{ vars.NAU_ATTRIBUTION_POLICY }}
        run: '"$RUNNER_TEMP/attribution"'
